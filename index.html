<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReelSaver - Download Instagram Reels</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(45deg, #ff4e50, #8e2de2, #ff9966);
  color: white;
  text-align: center;
}

.container {
  margin-top: 120px;
}

h1 {
  font-size: 40px;
}

p {
  font-size: 18px;
}

input {
  width: 80%;
  max-width: 400px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  outline: none;
  font-size: 16px;
}

button {
  padding: 12px 25px;
  border: none;
  border-radius: 10px;
  background: black;
  color: white;
  font-size: 16px;
  cursor: pointer;
  margin-top: 15px;
}

button:hover {
  background: #333;
}

#loader {
  margin-top: 20px;
  display: none;
}

.spinner {
  border: 4px solid #fff;
  border-top: 4px solid black;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  animation: spin 1s linear infinite;
  margin: auto;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

#result {
  margin-top: 20px;
  font-size: 18px;
}

.footer {
  position: fixed;
  bottom: 10px;
  width: 100%;
  font-size: 14px;
  opacity: 0.7;
}
</style>

</head>
<body>

<div class="container">
  <h1> ReelSaver</h1>
  <p>Download Instagram Reels Fast & Free</p>

  <input type="text" id="url" placeholder="Paste Instagram Reel link here">
  <br>
  <button onclick="download()">Download</button>

  <div id="loader">
    <div class="spinner"></div>
    <p>Processing...</p>
  </div>

  <div id="result"></div>
</div>

<div class="footer">
  Made with  | ReelSaver Tool
</div>

<script>
function download() {
  let url = document.getElementById("url").value;
  let loader = document.getElementById("loader");
  let result = document.getElementById("result");

  if(url === "") {
    alert("Link paste karo!");
    return;
  }

  loader.style.display = "block";
  result.innerHTML = "";

  setTimeout(() => {
    loader.style.display = "none";
    result.innerHTML = " Download feature abhi active nahi hai (backend/API connect karna padega)";
  }, 2000);
}
</script>

</body>
</html>
